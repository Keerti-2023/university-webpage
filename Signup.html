<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="Login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
</head>

<body style="background-image: url('./s.jpg');">


    <div class='login'>
        <h2>Signup </h2>
        <form id="registerForm">

            <div class="form-group">
                <input type='text' id="name" required>
                <i class="fa-solid fa-user"></i>
                <label for="">Name</label>

            </div>

            <div class="form-group">
                <input type='email' id="email" required>
                <i class="fa-solid fa-envelope"></i>
                <label for="">Email</label>

            </div>

            <div class="form-group">


                <input type='password' id="password" required>
                <label for="">Password</label>
                <i class="fa-solid fa-key"></i>

            </div>

            <button type='submit' value="submit" class='btn'>Submit</button>
            <p style="text-align:center;  margin-top: 10px; font-size: 15px; ">Already have an account ? <a
                    href="Login.html" style="text-decoration: none; font-weight: 500; color: blue;"> Login</a> </p>


        </form>





    </div>
    <script>
        console.log("script loaded");

        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            console.log("button clicked");

            const data = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value
            };

            console.log(data);
fetch("http://localhost:3000/register", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
})
.then(response => response.json())
.then(result => {

    if (result.success) {

       alert("Registration Successful!");
        window.location.href = "/university-webpage/Login.html";

    } else {

        alert(result.message);

    }

})
.catch(error => {
    console.log(error);
    alert("Server error");
});
        });
    </script>



</body>

</html>
